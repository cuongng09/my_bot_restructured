services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: telegram-bot-webapp
    restart: unless-stopped
    # Trên Linux, network_mode: host giúp:
    # 1. Kết nối trực tiếp Ollama tại localhost:11434 mà không cần cấu hình OLLAMA_HOST=0.0.0.0
    # 2. Đo thông số CPU, RAM, Disk của máy host chính xác qua psutil
    network_mode: host
    # Nếu chạy trên macOS/Windows hoặc muốn dùng bridge network, bạn có thể comment dòng 'network_mode: host'
    # và mở comment các dòng dưới:
    # ports:
    #   - "${WEBAPP_PORT:-8080}:${WEBAPP_PORT:-8080}"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # environment:
    #   - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./.env:/app/.env:ro
    environment:
      - RUNNING_WEBAPP=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}
