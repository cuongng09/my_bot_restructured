services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: telegram-bot-webapp
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./.env:/app/.env:ro
    environment:
      - RUNNING_WEBAPP=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}
