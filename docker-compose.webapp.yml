# =====================================================================
#  docker-compose.webapp.yml — Chạy độc lập Trạm Điều Khiển Web
#  Khởi chạy: docker compose -f docker-compose.webapp.yml up -d
# =====================================================================

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: telegram-bot-webapp
    restart: unless-stopped
    # Trên Linux, network_mode: host giúp:
    # 1. Kết nối trực tiếp Ollama tại localhost:11434
    # 2. Đo thông số CPU, RAM, Disk của máy host chính xác qua psutil
    network_mode: host
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./.env:/app/.env:ro
    environment:
      - RUNNING_WEBAPP=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}
