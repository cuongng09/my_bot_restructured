services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-ai-bot:latest
    container_name: telegram-ai-bot
    restart: unless-stopped
    command: ["python", "-m", "my_bot"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RUNNING_IN_DOCKER=1

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-ai-bot:latest
    container_name: telegram-bot-webapp
    restart: unless-stopped
    command: ["python", "-m", "my_bot.webapp.main"]
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
    env_file:
      - path: .env
        required: false
    environment:
      - RUNNING_WEBAPP=1
      - RUNNING_IN_DOCKER=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - BASE_URL=http://localhost:8081
    # Ensure JSON format enabled in settings.yml inside the volume
    # You may need to create ./searxng/settings.yml with appropriate configuration
