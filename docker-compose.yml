services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-ai-bot
    restart: unless-stopped
    command: ["python", "-m", "main"]
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./fonts:/app/fonts:ro
      - ./voices:/app/voices:ro
    environment:
      - PYTHONUNBUFFERED=1

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot-webapp
    restart: unless-stopped
    command: ["python", "-m", "webapp.main"]
    network_mode: host
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./.env:/app/.env:ro
    environment:
      - RUNNING_WEBAPP=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}

