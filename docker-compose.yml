services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-ai-bot:latest
    container_name: telegram-ai-bot
    restart: unless-stopped
    command: ["python", "-m", "main"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./fonts:/app/fonts:ro
      - ./voices:/app/voices:ro
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RUNNING_IN_DOCKER=1

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-ai-bot:latest
    container_name: telegram-bot-webapp
    restart: unless-stopped
    command: ["python", "-m", "webapp.main"]
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./fonts:/app/fonts:ro
      - ./voices:/app/voices:ro
    env_file:
      - path: .env
        required: false
    environment:
      - RUNNING_WEBAPP=1
      - RUNNING_IN_DOCKER=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - BASE_URL=http://localhost:8081
    # Ensure JSON format enabled in settings.yml inside the volume
    # You may need to create ./searxng/settings.yml with appropriate configuration

  voicebox:
    image: ghcr.io/jamiepine/voicebox:latest
    container_name: voicebox
    restart: unless-stopped
    ports:
      - "17493:8000"
    environment:
      - VOICEBOX_MODEL=medium
      - WHISPER_MODEL=medium
    # API endpoint will be http://localhost:17493
    # Ensure .env defines VOICEBOX_URL accordingly
