services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-ai-bot:latest
    container_name: telegram-ai-bot
    restart: unless-stopped
    command: ["python", "-m", "main"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./fonts:/app/fonts:ro
      - ./voices:/app/voices:ro
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RUNNING_IN_DOCKER=1

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-ai-bot:latest
    container_name: telegram-bot-webapp
    restart: unless-stopped
    command: ["python", "-m", "webapp.main"]
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./fonts:/app/fonts:ro
      - ./voices:/app/voices:ro
    env_file:
      - path: .env
        required: false
    environment:
      - RUNNING_WEBAPP=1
      - RUNNING_IN_DOCKER=1
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}
