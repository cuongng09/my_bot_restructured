[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_bot"
version = "1.0.0"
description = "Trợ lý AI đa năng trên Telegram chạy LLM cục bộ qua Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cwng" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "deep-translator>=1.11",
    "duckduckgo-search>=6.0",
    "trafilatura>=1.8",
    "langdetect>=1.0.9",
    "groq>=0.9",
    "gTTS>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0",
    "psutil>=5.9",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
my-bot = "main:main"
my-bot-web = "webapp.main:run_server"

[tool.setuptools.packages.find]
where = ["src"]

