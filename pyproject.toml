[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_bot"
version = "1.1.0"
description = "Trợ lý AI đa năng trên Telegram chạy LLM cục bộ qua Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "cwng" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "trafilatura>=1.8",
    "langdetect>=1.0.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
my-bot = "my_bot.main:main"
my-bot-web = "my_bot.webapp.main:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_bot = ["webapp/static/*"]
